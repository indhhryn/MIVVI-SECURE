<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIVVI SECURE — Prototype Web Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cosmic: #080A18;
      --navy: #10162D;
      --card: #1A2146;
      --card-border: rgba(150, 160, 210, 0.22);
      --violet: #6852E8;
      --cyan: #63DDE8;
      --pearl: #F5F5FC;
      --muted: #A8B0C8;
      --green: #2DD4BF;
      --amber: #F59E0B;
      --red: #F43F5E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #161c3d 0%, #080a18 70%);
      color: var(--pearl);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 40px;
    }

    .top-banner {
      max-width: 440px;
      width: 100%;
      text-align: center;
      margin-bottom: 16px;
    }

    .top-banner .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--cyan);
      background: rgba(99, 221, 232, 0.12);
      border: 1px solid rgba(99, 221, 232, 0.3);
      border-radius: 99px;
      margin-bottom: 6px;
    }

    .top-banner h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--pearl);
    }

    .top-banner p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Device Mockup Shell */
    .device-shell {
      width: 100%;
      max-width: 412px;
      height: 844px;
      background: linear-gradient(145deg, #0d1226, #080A18 60%, #121835);
      border-radius: 44px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7),
                  0 0 0 1px rgba(255, 255, 255, 0.1),
                  0 0 40px rgba(104, 82, 232, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Status Bar */
    .status-bar {
      height: 38px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      z-index: 10;
      user-select: none;
    }

    .device-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background: linear-gradient(170deg, var(--cosmic) 0%, var(--navy) 45%, #16193E 100%);
    }

    .header-bar {
      padding: 10px 20px 6px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--cyan);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-tag {
      font-size: 9.5px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 400;
    }

    .page-title {
      font-size: 21px;
      font-weight: 800;
      color: var(--pearl);
      margin-top: 4px;
      letter-spacing: -0.01em;
    }

    .page-subtitle {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .scroll-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .scroll-body::-webkit-scrollbar {
      width: 4px;
    }
    .scroll-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .card-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--pearl);
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.45;
    }

    .card-tag {
      display: inline-block;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-top: 8px;
    }

    /* Buttons */
    .btn {
      width: 100%;
      min-height: 46px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      user-select: none;
      padding: 9px 16px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--cyan);
      color: var(--cosmic);
      box-shadow: 0 4px 14px rgba(99, 221, 232, 0.25);
    }

    .btn-primary:hover {
      filter: brightness(1.08);
    }

    .btn-secondary {
      background: #262c4c;
      color: var(--pearl);
      border: 1px solid rgba(160, 170, 220, 0.3);
    }

    .btn-secondary:hover {
      background: #313960;
    }

    .btn-danger {
      background: rgba(244, 63, 94, 0.16);
      color: var(--red);
      border: 1px solid rgba(244, 63, 94, 0.35);
    }

    .btn-danger:hover {
      background: rgba(244, 63, 94, 0.26);
    }

    /* Inputs */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .input-field {
      width: 100%;
      background: #0f162c;
      border: 1px solid rgba(160, 170, 220, 0.32);
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--pearl);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(99, 221, 232, 0.2);
    }

    textarea.input-field {
      min-height: 100px;
      resize: vertical;
      line-height: 1.45;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-val {
      font-size: 26px;
      font-weight: 800;
      color: var(--cyan);
    }

    .stat-label {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Score Banner */
    .score-banner {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      border: 1px solid var(--card-border);
    }

    .score-number {
      font-size: 52px;
      font-weight: 900;
      line-height: 1;
      margin: 4px 0;
    }

    .score-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    /* Bottom Navigation */
    .bottom-nav {
      height: 58px;
      background: #0a0e20;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 6px;
      flex-shrink: 0;
      user-select: none;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      height: 100%;
      transition: color 0.15s;
    }

    .nav-item.active {
      color: var(--cyan);
      font-weight: 700;
    }

    .nav-icon {
      font-size: 15px;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-chip {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      background: #232a46;
      color: var(--pearl);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .filter-chip.active {
      background: var(--cyan);
      color: var(--cosmic);
      border-color: var(--cyan);
    }

    /* Indicator row */
    .indicator-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 11px;
      background: rgba(16, 22, 45, 0.6);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .indicator-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 700;
    }

    .indicator-desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    .history-card {
      cursor: pointer;
      transition: background 0.15s;
    }
    .history-card:hover {
      background: #202956;
    }

    /* Modal / Popup */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(8, 10, 24, 0.85);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background: #141b38;
      border: 1px solid rgba(150, 160, 210, 0.35);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-height: 85%;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .modal-title {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--pearl);
      margin-bottom: 8px;
    }

    .modal-content {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 16px;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <div class="top-banner">
    <div class="badge">✦ Live Localhost Simulator</div>
    <h1>MIVVI SECURE Mobile Prototype</h1>
    <p>Simulasi lengkap antarmuka Android Kotlin MIVVI SECURE selaras dengan spesifikasi README & Figma.</p>
  </div>

  <!-- Device Container -->
  <div class="device-shell">
    <!-- Status Bar -->
    <div class="status-bar">
      <span id="clock-display">12:00</span>
      <span>✦ 5G &nbsp;●●●</span>
    </div>

    <!-- Active Screen -->
    <div class="device-screen" id="app-screen">
      <!-- Dynamic Screen Content -->
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav" id="bottom-navigation" style="display: none;">
      <div class="nav-item active" onclick="navigate('home')">
        <div class="nav-icon">🏠</div>
        <span>Beranda</span>
      </div>
      <div class="nav-item" onclick="navigate('activities')">
        <div class="nav-icon">🔔</div>
        <span>Aktivitas</span>
      </div>
      <div class="nav-item" onclick="navigate('history')">
        <div class="nav-icon">📋</div>
        <span>Riwayat</span>
      </div>
      <div class="nav-item" onclick="navigate('education')">
        <div class="nav-icon">🛡️</div>
        <span>Edukasi</span>
      </div>
      <div class="nav-item" onclick="navigate('settings')">
        <div class="nav-icon">⚙️</div>
        <span>Pengaturan</span>
      </div>
    </div>

    <!-- Modal Dialog -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-box">
        <div class="modal-title" id="modal-title">Judul Dialog</div>
        <div class="modal-content" id="modal-body">Pesan dialog</div>
        <button class="btn btn-primary" onclick="closeModal()">Tutup</button>
      </div>
    </div>
  </div>

  <script>
    // Live Clock
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock-display').innerText = `${h}:${m}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Default Configuration matching rules.json
    let activeConfig = {
      version: "1.0.0",
      weights: {
        suspicious_keyword: 2,
        url_outside_whitelist: 3,
        shortlink: 2,
        unknown_sender: 2,
        urgency: 1,
        sensitive_data: 3
      },
      thresholds: {
        suspicious_from: 3,
        phishing_from: 6
      },
      keywords: [
        "menang", "hadiah", "verifikasi akun", "klik link", "klik tautan",
        "rekening diblokir", "akun diblokir", "terblokir", "kode otp", "otp",
        "pembaruan data", "konfirmasi akun", "klaim hadiah", "akun anda"
      ],
      urgency_patterns: [
        "segera", "1x24 jam", "24 jam", "hari ini", "secepatnya",
        "segera lakukan", "batas waktu", "terakhir hari ini", "jangan sampai terlambat",
        "akan diblokir", "sebelum terlambat"
      ],
      sensitive_patterns: ["otp", "pin", "password", "kata sandi", "nomor kartu", "cvv", "kode verifikasi"],
      official_domains: [
        "bankmandiri.co.id", "bca.co.id", "bri.co.id", "bni.co.id",
        "bankindonesia.go.id", "pajak.go.id", "bpjs-kesehatan.go.id"
      ],
      shortlink_domains: ["bit.ly", "tinyurl.com", "t.co", "goo.gl", "cutt.ly", "s.id", "rb.gy", "tiny.cc"]
    };

    // Load active config from FastAPI backend
    async function fetchRulesFromAPI() {
      try {
        const res = await fetch('/api/v1/rules');
        if (res.ok) {
          activeConfig = await res.json();
          console.log("Config loaded from FastAPI:", activeConfig.version);
        }
      } catch (err) {
        console.warn("Using offline rules config:", err);
      }
    }
    fetchRulesFromAPI();

    // Local Storage Mock Database
    function getRecords() {
      try {
        const stored = localStorage.getItem('mivvi_records');
        if (!stored) {
          // Initialize demo records if empty
          const seed = [
            {
              id: 'rec_seed_1',
              source: 'WHATSAPP',
              sender: 'Bank BNI CS (Palsu)',
              content: 'Info: Rek Anda TERBLOKIR. Segera verifikasi & klik bit.ly/verif-akun24 dalam 1x24 jam. Masukkan kode OTP Anda.',
              timestamp: Date.now() - 1800000,
              result: analyzeMessage('Info: Rek Anda TERBLOKIR. Segera verifikasi & klik bit.ly/verif-akun24 dalam 1x24 jam. Masukkan kode OTP Anda.', 'Bank BNI CS (Palsu)'),
              isDemo: true
            },
            {
              id: 'rec_seed_2',
              source: 'SMS',
              sender: 'Telkomsel Info',
              content: 'Paket data 50GB aktif hingga 30/12/2026. Cek kuota berkala di aplikasi MyTelkomsel resmi https://telkomsel.com',
              timestamp: Date.now() - 7200000,
              result: analyzeMessage('Paket data 50GB aktif hingga 30/12/2026. Cek kuota berkala di aplikasi MyTelkomsel resmi https://telkomsel.com', 'Telkomsel Info', ['Telkomsel Info']),
              isDemo: true
            },
            {
              id: 'rec_seed_3',
              source: 'WHATSAPP',
              sender: 'Teman Kantor',
              content: '',
              timestamp: Date.now() - 10800000,
              result: { score: 0, category: 'KONTEN TIDAK TERSEDIA', level: 'Tidak Tersedia', features: [], urls: [], version: '1.0.0' },
              isDemo: true
            }
          ];
          saveRecords(seed);
          return seed;
        }
        return JSON.parse(stored);
      } catch {
        return [];
      }
    }

    function saveRecords(records) {
      localStorage.setItem('mivvi_records', JSON.stringify(records));
    }

    function addRecord(record) {
      const records = getRecords();
      records.unshift(record);
      saveRecords(records);
    }

    function deleteRecord(id) {
      const records = getRecords().filter(r => r.id !== id);
      saveRecords(records);
    }

    function clearRecords() {
      saveRecords([]);
    }

    // Modal helpers
    function showModal(title, message) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerText = message;
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    // Rule-Based Risk Scoring Algorithm (matches RuleBasedAnalyzer.kt strictly)
    function analyzeMessage(message, sender = '', trustedSenders = []) {
      const raw = message.trim();
      const lower = raw.toLowerCase();

      // Normalize letters (kl1k -> klik, etc.)
      const normalized = lower
        .replace(/(?<=\p{L})1(?=\p{L})/gu, 'i')
        .replace(/(?<=\p{L})0(?=\p{L})/gu, 'o')
        .replace(/(?<=\p{L})@(?=\p{L})/gu, 'a');

      // Extract URLs
      const urlRegex = /(?:https?:\/\/|www\.)[^\s<>"']+|([a-z0-9-]+\.)+(com|net|org|id|co\.id|go\.id|xyz|site|online|info|app|me)(?:\/[^\s<>"']*)?/gi;
      const urls = raw.match(urlRegex) || [];

      // Extract hostnames
      const hosts = urls.map(u => {
        let clean = u.replace(/^https?:\/\//i, '').replace(/^www\./i, '');
        return clean.split('/')[0].split('?')[0].toLowerCase();
      });

      // Match Keywords
      const matchedKeywords = activeConfig.keywords.filter(k => normalized.includes(k.toLowerCase()));
      const matchedUrgency = activeConfig.urgency_patterns.filter(u => normalized.includes(u.toLowerCase()));
      const matchedSensitive = activeConfig.sensitive_patterns.filter(s => normalized.includes(s.toLowerCase()));

      // Check Whitelist & Shortlinks
      const isOfficial = host => activeConfig.official_domains.some(od => host === od || host.endsWith('.' + od));
      const isShortlink = host => activeConfig.shortlink_domains.some(sd => host === sd || host.endsWith('.' + sd));

      const outsideHosts = hosts.filter(h => !isOfficial(h));
      const shortHosts = hosts.filter(h => isShortlink(h));

      // Unknown sender check
      const normalizeSender = s => s.toLowerCase().replace(/[^a-z0-9+]/g, '').replace(/^\+62/, '0').replace(/^62/, '0');
      const normSender = normalizeSender(sender);
      const trustedList = trustedSenders.map(normalizeSender).filter(s => s);
      const isSenderKnown = normSender !== '' && trustedList.includes(normSender);
      const isSenderUnknown = normSender !== '' && !isSenderKnown;

      // Calculate Indicators
      const features = [
        {
          id: 'suspicious_keyword',
          label: 'Kata kunci mencurigakan',
          detected: matchedKeywords.length > 0,
          points: activeConfig.weights.suspicious_keyword || 2,
          explanation: matchedKeywords.length > 0 ? `Ditemukan: ${matchedKeywords.join(', ')}` : 'Tidak ditemukan keyword dari daftar deteksi.'
        },
        {
          id: 'url_outside_whitelist',
          label: 'URL di luar whitelist resmi',
          detected: outsideHosts.length > 0,
          points: activeConfig.weights.url_outside_whitelist || 3,
          explanation: urls.length === 0 ? 'Tidak ditemukan URL pada pesan.' : (outsideHosts.length > 0 ? `Domain di luar whitelist: ${outsideHosts.join(', ')}` : 'Domain cocok dengan whitelist resmi.')
        },
        {
          id: 'shortlink',
          label: 'Penggunaan shortlink penyamaran',
          detected: shortHosts.length > 0,
          points: activeConfig.weights.shortlink || 2,
          explanation: shortHosts.length > 0 ? `Shortlink terdeteksi: ${shortHosts.join(', ')}` : 'Tidak terdeteksi domain shortlink.'
        },
        {
          id: 'unknown_sender',
          label: 'Pengirim tidak dikenal / nomor baru',
          detected: isSenderUnknown,
          points: activeConfig.weights.unknown_sender || 2,
          explanation: sender.trim() === '' ? 'Identitas pengirim tidak tersedia; indikator tidak dihitung.' : (isSenderUnknown ? `Pengirim (${sender}) belum ada dalam daftar tepercaya.` : 'Pengirim cocok dengan daftar tepercaya.')
        },
        {
          id: 'urgency',
          label: 'Pola urgensi buatan',
          detected: matchedUrgency.length > 0,
          points: activeConfig.weights.urgency || 1,
          explanation: matchedUrgency.length > 0 ? `Pola urgensi terdeteksi: ${matchedUrgency.join(', ')}` : 'Tidak ada pola desakan waktu.'
        },
        {
          id: 'sensitive_data',
          label: 'Permintaan data sensitif (Kredensial)',
          detected: matchedSensitive.length > 0,
          points: activeConfig.weights.sensitive_data || 3,
          explanation: matchedSensitive.length > 0 ? `Data sensitif: ${matchedSensitive.join(', ')}` : 'Tidak ada permintaan data sensitif.'
        }
      ];

      const score = features.reduce((acc, f) => acc + (f.detected ? f.points : 0), 0);

      let category = 'AMAN';
      let level = 'Risiko Rendah';
      if (score >= activeConfig.thresholds.phishing_from) {
        category = 'PHISHING';
        level = 'Risiko Tinggi';
      } else if (score >= activeConfig.thresholds.suspicious_from) {
        category = 'MENCURIGAKAN';
        level = 'Risiko Sedang';
      }

      return {
        score,
        category,
        level,
        features,
        urls,
        version: activeConfig.version
      };
    }

    // Navigation and Page Rendering
    let currentPage = 'welcome';
    let simulatedNotificationAccess = true;

    function navigate(page, data = null) {
      currentPage = page;
      const screen = document.getElementById('app-screen');
      const bottomNav = document.getElementById('bottom-navigation');

      // Update Nav active style

        ["Q.06 Di mana riwayat analisis disimpan?", "Riwayat disimpan secara lokal di database SQLite perangkat Anda. Tidak ada pengiriman data pesan ke cloud pihak ketiga."]
      ];

            <div class="card">
              <div class="card-title" style="font-size: 13px;">${q}</div>

              <div class="card-tag" style="color: var(--cyan);">ARSIP TERVERIFIKASI</div>
            </div>
          `).join('')}

          <button class="btn btn-secondary" onclick="navigate('detection')">Pelajari Metode Deteksi</button>
          <button class="btn btn-secondary" onclick="navigate('privacy')">Lihat Kebijakan Privasi & Data</button>
          <button class="btn btn-primary" onclick="navigate('settings')">Kembali ke Pengaturan</button>
        </div>
      `;
    }

            <div class="card-tag" style="color: var(--green);">0% CLOUD LEAK • PENYIMPANAN PRIVAT</div>

          </div>

    // 15. Metode Deteksi & Simulator Bobot 6 Aturan Interaktif
    function renderDetectionMethods(container) {
      container.innerHTML = `
        <div class="header-bar">
          <div class="brand-title">✦ MIVVI SECURE <span class="brand-tag">// METODE DETEKSI</span></div>
          <div class="page-title">Metode Deteksi</div>
          <div class="page-subtitle">Transparansi Rule-Based Risk Scoring deterministik.</div>
        </div>
        <div class="scroll-body">
          <div class="card">
            <div class="card-title">Sistem Penilaian Deterministik</div>
            <div class="card-desc">Sistem memeriksa 6 indikator statis dan menjumlahkan penalti bobot risiko secara modular. Uji coba langsung di bawah:</div>

            <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;" id="sim-toggles">
              <label style="display: flex; gap: 8px; font-size: 12.5px; color: var(--pearl); align-items: flex-start;">
                <input type="checkbox" id="sim-cb-1" onchange="calcLiveSim()" style="margin-top: 3px;">
                <span><b>Keyword mencurigakan (+2 Poin)</b><br><span style="font-size: 11px; color: var(--muted);">'TERBLOKIR', 'hadiah', 'verifikasi'</span></span>
              </label>
              <label style="display: flex; gap: 8px; font-size: 12.5px; color: var(--pearl); align-items: flex-start;">
                <input type="checkbox" id="sim-cb-2" onchange="calcLiveSim()" style="margin-top: 3px;">
                <span><b>URL di luar whitelist (+3 Poin)</b><br><span style="font-size: 11px; color: var(--muted);">Domain tidak terdaftar di direktori resmi</span></span>
              </label>
              <label style="display: flex; gap: 8px; font-size: 12.5px; color: var(--pearl); align-items: flex-start;">
                <input type="checkbox" id="sim-cb-3" onchange="calcLiveSim()" style="margin-top: 3px;">
                <span><b>Penggunaan shortlink (+2 Poin)</b><br><span style="font-size: 11px; color: var(--muted);">bit.ly, s.id, tinyurl</span></span>
              </label>
              <label style="display: flex; gap: 8px; font-size: 12.5px; color: var(--pearl); align-items: flex-start;">
                <input type="checkbox" id="sim-cb-4" onchange="calcLiveSim()" style="margin-top: 3px;">
                <span><b>Pengirim tak terverifikasi (+2 Poin)</b><br><span style="font-size: 11px; color: var(--muted);">Nomor baru / bukan pengirim tepercaya</span></span>
              </label>
              <label style="display: flex; gap: 8px; font-size: 12.5px; color: var(--pearl); align-items: flex-start;">
                <input type="checkbox" id="sim-cb-5" onchange="calcLiveSim()" style="margin-top: 3px;">
                <span><b>Tekanan urgensi waktu (+1 Poin)</b><br><span style="font-size: 11px; color: var(--muted);">'1x24 jam', 'segera'</span></span>
              </label>
              <label style="display: flex; gap: 8px; font-size: 12.5px; color: var(--pearl); align-items: flex-start;">
                <input type="checkbox" id="sim-cb-6" onchange="calcLiveSim()" style="margin-top: 3px;">
                <span><b>Permintaan data sensitif (+3 Poin)</b><br><span style="font-size: 11px; color: var(--muted);">OTP, PIN, Password, Kode Verifikasi</span></span>
              </label>
            </div>

            <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 10px; margin-top: 12px; text-align: center;">
              <div id="sim-result-badge" class="score-badge" style="background: var(--green); color: var(--cosmic);">STATUS: AMAN (MINIMAL)</div>
              <div id="sim-result-score" style="font-size: 32px; font-weight: 900; color: var(--green);">SKOR: 0</div>
              <div id="sim-result-formula" style="font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--muted); margin-top: 4px;">Formula: 0 + 0 + 0 + 0 + 0 + 0 = 0 / 13</div>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 10px;">
              <button class="btn btn-secondary" style="flex: 1; min-height: 38px; font-size: 11.5px;" onclick="simSelectAll(true)">PILIH SEMUA (SKOR 13)</button>
              <button class="btn btn-secondary" style="flex: 1; min-height: 38px; font-size: 11.5px;" onclick="simSelectAll(false)">RESET (SKOR 0)</button>
            </div>
          </div>

          <div class="card">
            <div class="card-title">Formula Skor & Ambang Batas</div>
            <div class="card-desc" style="line-height: 1.6;">
              • <b>AMAN (0–2)</b>: Pola pesan normal & wajar<br>
              • <b>MENCURIGAKAN (3–5)</b>: Ada indikator anomali, butuh verifikasi manual<br>
              • <b>PHISHING (≥6)</b>: Indikasi kuat rekayasa sosial<br><br>
              Skenario Total: 2 + 3 + 2 + 2 + 1 + 3 = 13 (Kategori PHISHING) jika keenam indikator terpenuhi serempak.
            </div>
          </div>

          <button class="btn btn-secondary" onclick="navigate('faq')">Buka Pusat Bantuan & FAQ</button>
          <button class="btn btn-primary" onclick="navigate('settings')">Kembali ke Pengaturan</button>
        </div>
      `;

      function calcLiveSim() {
        const weights = [2, 3, 2, 2, 1, 3];
        let total = 0;
        const parts = [];
        for (let i = 1; i <= 6; i++) {
          const cb = document.getElementById('sim-cb-' + i);
          if (cb && cb.checked) {
            total += weights[i - 1];
            parts.push('+' + weights[i - 1]);
          } else {
            parts.push('+0');
          }
        }
        let status = 'AMAN';
        let color = 'var(--green)';
        if (total >= 6) { status = 'PHISHING'; color = 'var(--red)'; }
        else if (total >= 3) { status = 'MENCURIGAKAN'; color = 'var(--amber)'; }

        document.getElementById('sim-result-badge').innerText = `STATUS: ${status}`;
        document.getElementById('sim-result-badge').style.background = color;
        document.getElementById('sim-result-score').innerText = `SKOR: ${total}`;
        document.getElementById('sim-result-score').style.color = color;
        document.getElementById('sim-result-formula').innerText = `Formula: ${parts.join(' ')} = ${total} / 13`;
      }
      window.calcLiveSim = calcLiveSim;

      function simSelectAll(val) {
        for (let i = 1; i <= 6; i++) {
          const cb = document.getElementById('sim-cb-' + i);
          if (cb) cb.checked = val;
        }
        calcLiveSim();
      }
      window.simSelectAll = simSelectAll;
    }

    // 16. Pengaturan (Settings)
    function renderSettings(container) {
      const savedTrusted = localStorage.getItem('mivvi_trusted_senders') || '';
      const savedApiUrl = localStorage.getItem('mivvi_api_url') || 'http://127.0.0.1:8000';

      container.innerHTML = `
        <div class="header-bar">
          <div class="brand-title">✦ MIVVI SECURE <span class="brand-tag">// PENGATURAN</span></div>
          <div class="page-title">Pengaturan</div>
          <div class="page-subtitle">Atur pengalaman dan keamanan aplikasimu.</div>
        </div>
        <div class="scroll-body">
          <div class="card" style="border-color: ${simulatedNotificationAccess ? 'var(--green)' : 'var(--amber)'};">
            <div class="card-title">Akses Notifikasi Android</div>
            <div class="card-desc">${simulatedNotificationAccess ? "Izin Notification Access aktif [Mode Demo / Connected]." : "Izin Notification Access belum diberikan."}</div>
            <button class="btn btn-secondary" style="min-height: 38px; margin-top: 10px; font-size: 11.5px;" onclick="navigate('guide')">
              Panduan & Pengaturan Akses Android
            </button>
          </div>

          <div style="font-size: 13.5px; font-weight: 800; color: var(--pearl); margin-top: 4px;">Kelola Sumber Analisis</div>
          <label style="display: flex; gap: 8px; font-size: 13px; color: var(--pearl); align-items: center;">
            <input type="checkbox" id="set-wa" checked> WhatsApp Messenger & Business
          </label>
          <label style="display: flex; gap: 8px; font-size: 13px; color: var(--pearl); align-items: center;">
            <input type="checkbox" id="set-sms" checked> Aplikasi SMS Bawaan
          </label>

          <div style="font-size: 13.5px; font-weight: 800; color: var(--pearl); margin-top: 6px;">Pengirim Tepercaya</div>
          <div style="font-size: 11px; color: var(--muted);">Masukkan satu identitas/nomor per baris. Pengirim di luar daftar akan mendapat indikator (+2).</div>
          <textarea class="input-field" id="trusted-field" placeholder="Contoh:&#10;08123456789&#10;Bank Mandiri Resmi">${savedTrusted}</textarea>

          <div style="font-size: 13.5px; font-weight: 800; color: var(--pearl); margin-top: 6px;">Integrasi Data (Rules API)</div>
          <div style="font-size: 11px; color: var(--muted);">Base URL backend untuk mengambil pembaruan aturan deteksi dan whitelist. Isi pesan tidak dikirim ke API.</div>
          <input type="text" class="input-field" id="api-field" value="${savedApiUrl}">

          <button class="btn btn-primary" onclick="saveSettings()">Simpan & Sinkronkan Aturan</button>

          <div style="font-size: 13.5px; font-weight: 800; color: var(--pearl); margin-top: 8px;">Dokumentasi & Standar</div>
          <button class="btn btn-secondary" onclick="navigate('detection')">Tentang & Metode Deteksi (Simulator Bobot)</button>
          <button class="btn btn-secondary" onclick="navigate('faq')">Pusat Bantuan & FAQ</button>
          <button class="btn btn-secondary" onclick="navigate('privacy')">Privasi dan Penggunaan Data</button>

          <button class="btn btn-danger" onclick="if(confirm('Hapus seluruh riwayat analisis lokal?')){ clearRecords(); showModal('Riwayat Dihapus', 'Seluruh riwayat analisis lokal berhasil dibersihkan.'); }">
            Hapus Semua Riwayat Analisis Lokal
          </button>

          <div style="font-size: 9.5px; font-weight: 700; color: var(--cyan); text-align: center; margin-top: 10px;">
            MIVVI SECURE • RULE-BASED RISK SCORING • PROTOTYPE 1.0
          </div>
        </div>
      `;
    }

    async function saveSettings() {
      const trusted = document.getElementById('trusted-field').value;
      const apiUrl = document.getElementById('api-field').value.trim();

      localStorage.setItem('mivvi_trusted_senders', trusted);
      localStorage.setItem('mivvi_api_url', apiUrl);

      if (apiUrl) {
        try {
          const endpoint = apiUrl.replace(/\/+$/, '') + '/api/v1/rules';
          const res = await fetch(endpoint);
          if (res.ok) {
            activeConfig = await res.json();
            showModal('Sinkronisasi Berhasil', `Pengaturan tersimpan dan aturan API versi ${activeConfig.version} berhasil disinkronkan secara real-time!`);
            return;
          }
        } catch (e) {
          showModal('Sinkronisasi Gagal', `Pengaturan tersimpan, namun gagal menghubungi API: ${e.message}. Aturan lokal tetap aktif.`);
          return;
        }
      }
      showModal('Pengaturan Tersimpan', 'Pengaturan berhasil diperbarui. Menggunakan konfigurasi aturan lokal.');
    }

    // Initialize to welcome screen
    navigate('welcome');
  </script>
